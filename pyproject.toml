[build-system]
requires = ["setuptools>=77,<83", "wheel>=0.45,<0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "cicobase"
version = "0.4.0"
description = "Python port of CICOBase routines for practical identifiability analysis and confidence interval evaluation."
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Evgeny Metelkin" },
    { name = "Ivan Borisov" },
    { name = "Victoria Tkachenko" },
]
keywords = [
    "confidence intervals",
    "identifiability analysis",
    "likelihood profiling",
    "optimization",
    "systems biology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.6,<4",
    "nlopt>=2.10,<2.11",
    "numpy>=1.23,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
docs = [
    "sphinx>=8,<10",
    "sphinx-rtd-theme>=3,<4",
]
build = [
    "build>=1.2,<2",
    "twine>=5,<7",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "sphinx>=8,<10",
    "sphinx-rtd-theme>=3,<4",
    "tox>=4,<5",
    "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/insysbio/CICOBase.py"
Repository = "https://github.com/insysbio/CICOBase.py"
Issues = "https://github.com/insysbio/CICOBase.py/issues"
Documentation = "https://insysbio.github.io/CICOBase.py/"
Upstream = "https://github.com/insysbio/CICOBase.jl"

[tool.setuptools]
packages = ["cicobase", "likelihoodprofiler"]

[tool.pytest.ini_options]
testpaths = ["cicobase/tests"]
